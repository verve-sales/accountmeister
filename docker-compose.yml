# Pilotbetrieb: Caddy (TLS) + Anwendung + PostgreSQL. Geheimnisse ausschließlich in .env.production (nicht im Git).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: verve_sales
      POSTGRES_USER: verve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env.production setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verve -d verve_sales"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://verve:${POSTGRES_PASSWORD}@db:5432/verve_sales
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: https://${DOMAIN:?DOMAIN in .env.production setzen}/api/auth/callback
      OIDC_AUTO_CREATE_USERS: ${OIDC_AUTO_CREATE_USERS:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Verve Consulting}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_DAILY_JOB_LIMIT: ${AI_DAILY_JOB_LIMIT:-200}
      LANGDOCK_API_KEY: ${LANGDOCK_API_KEY:-}
      LANGDOCK_BASE_URL: ${LANGDOCK_BASE_URL:-https://api.langdock.com/openai/eu/v1}
      LANGDOCK_DEFAULT_MODEL: ${LANGDOCK_DEFAULT_MODEL:-gpt-4o-mini}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET in .env.production setzen}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-43200}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-7200}
      RATE_LIMIT_LOGIN_PER_15MIN: ${RATE_LIMIT_LOGIN_PER_15MIN:-20}
      RATE_LIMIT_WRITES_PER_MIN: ${RATE_LIMIT_WRITES_PER_MIN:-120}
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
